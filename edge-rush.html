<body>
  <main class="game-shell">
    <a class="back" href="index.html">← Back to games</a>
    <section class="game-head">
      <div><p class="kicker">PINEAPP.WIN ORIGINAL</p><h1>Edge Rush</h1></div>

    <section class="instructions"><span>Click the section the ball reaches.</span><span>Each hit gets faster.</span></section>

      <div class="corner corner-tl" aria-hidden="true"></div>

      <div class="corner corner-br" aria-hidden="true"></div>

      <div id="edge-right" class="edge edge-right" aria-label="Right edge"></div>
      <div id="edge-bottom" class="edge edge-bottom" aria-label="Bottom edge"></div>
      <div id="edge-left" class="edge edge-left" aria-label="Left edge"></div>
      <div id="ball" class="ball" aria-hidden="true"></div>
      <div id="overlay" class="overlay"><div><p class="kicker">READY?</p><h2>Stay on the edge.</h2><p>Click Start, then catch the ball at the border.</p><button id="start" type="button">Start game <span>→</span></button></div></div>

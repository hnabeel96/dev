name: Deploy Zunlo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            # Safety: pulling moves the site files into public/. Only do that once nginx
            # serves the separate web root, or the live site would briefly lose its pages.
            grep -q 'root /var/www/zunlo-site;' /etc/nginx/sites-available/zunlo || { echo "nginx is not serving /var/www/zunlo-site yet; refusing to deploy"; exit 1; }

            cd /var/www/zunlo
            git pull origin main

            # Publish only public/ into the web root, which lives OUTSIDE the
            # repository, so .git, .github and notes can never be served.
            [ -f public/index.html ] || { echo "public/index.html is missing; refusing to publish"; exit 1; }
            rsync -a --delete --chmod=D755,F644 --exclude='.well-known/' public/ /var/www/zunlo-site/

      - name: Check out the code (for the checks below)
        uses: actions/checkout@v4

      - name: Check that private files are not public
        run: bash .github/scripts/check-private-paths.sh https://pineapp.win https://www.pineapp.win

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neonLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5ff99"/>
      <stop offset="60%" stop-color="#d9f36a"/>
      <stop offset="100%" stop-color="#95b828"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5fffa"/>
      <stop offset="100%" stop-color="#35f6ff"/>
    </linearGradient>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#151d19"/>
      <stop offset="100%" stop-color="#0b0f0d"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="64" height="64" rx="14" fill="url(#darkBg)" stroke="#23312a" stroke-width="2"/>
  
  <!-- Pineapple Crown / Leaves (Cyan) -->
  <path d="M32 10 C32 10, 30 18, 23 20 C28 20, 31 23, 32 26 C33 23, 36 20, 41 20 C34 18, 32 10, 32 10 Z" fill="url(#neonCyan)" filter="url(#glow)"/>
  <path d="M32 13 C35 15, 39 16, 43 14 C40 18, 37 20, 35 24 Z" fill="#5ef3d2" opacity="0.8"/>
  <path d="M32 13 C29 15, 25 16, 21 14 C24 18, 27 20, 29 24 Z" fill="#5ef3d2" opacity="0.8"/>

  <!-- Pineapple Body (Neon Lime Oval with diamond arcade grid) -->
  <ellipse cx="32" cy="38" rx="16" ry="18" fill="url(#neonLime)" filter="url(#glow)"/>
  
  <!-- Inner Cyberpunk Geometric Cuts -->
  <path d="M22 34 L42 34 M20 40 L44 40 M24 46 L40 46 M27 28 L37 48 M37 28 L27 48 M23 38 L32 54 L41 38" stroke="#0b0f0d" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
</svg>

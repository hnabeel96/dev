<style>
/* layout: full-bleed WebGL cabinet, 2D effects layer on top, instruction placard overlay for start/end */
:root{
  --ink:#0b0912;
  --panel:rgba(13,10,22,.86);
  --amber:#ffb22e;
  --led:#ff4a2e;
  --cream:#f4ebdd;
  --mute:#b3a9c7;
  --line:rgba(255,178,46,.35);
  --display:'Bungee', Impact, 'Arial Black', sans-serif;
  --body:'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--cream);font-family:var(--body);-webkit-user-select:none;user-select:none}
#gl,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:none}
#fx{pointer-events:none}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at center,rgba(11,9,18,.2),rgba(11,9,18,.7))}
.card{max-width:380px;width:100%;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
.card h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,13vw,64px);line-height:.9;margin:0;color:var(--amber);text-shadow:0 0 18px rgba(255,140,30,.55),3px 3px 0 #7a1d06;text-wrap:balance}
.big{font-family:var(--display);font-size:88px;line-height:1;color:var(--led);text-shadow:0 0 22px rgba(255,74,46,.7);font-variant-numeric:tabular-nums}
.flag{font-family:var(--display);font-size:15px;color:var(--ink);background:var(--amber);padding:5px 12px 3px;border-radius:4px}
.card p{margin:0;font-size:19px;font-weight:500;color:var(--cream)}
.coin{font-family:var(--display);font-size:20px;color:#fff;background:radial-gradient(circle at 50% 30%,#ff7a5a,#e0261a 55%,#8e0f08);border:3px solid #2a0a06;padding:16px 34px 13px;border-radius:999px;box-shadow:0 6px 0 #4a0904,0 0 26px rgba(255,60,30,.45),inset 0 2px 0 rgba(255,255,255,.35);cursor:pointer;letter-spacing:.04em}
.coin:active{transform:translateY(4px);box-shadow:0 2px 0 #4a0904,0 0 18px rgba(255,60,30,.4),inset 0 2px 0 rgba(255,255,255,.3)}
.coin:focus-visible{outline:3px solid var(--amber);outline-offset:5px}
.err{max-width:34ch}
/* pineapp.win arcade top bar + coin gate */
.hud-top{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.hud-top>*{pointer-events:auto}
.hud-back{width:38px;height:38px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--cream);font:700 20px/1 var(--body);text-decoration:none}
.hud-back:hover{border-color:var(--amber)}
.hud-back:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.get-coins{display:inline-flex;align-items:center;gap:12px;padding:14px 26px 12px;border-radius:999px;border:2px solid var(--amber);background:rgba(40,24,6,.7);color:#ffe58a;font-family:var(--display);font-size:18px;text-decoration:none}
.get-coins .coin-icon{width:24px;height:24px}
.get-coins .coin-icon::after{inset:6px}
.get-coins:focus-visible{outline:3px solid var(--amber);outline-offset:5px}

<script>
(() => {
const $ = id => document.getElementById(id);
if (!window.THREE) { $('startScreen').querySelector('.card').innerHTML = '<p class="err">The 3D engine could not load. Check your connection and reload the page.</p>'; return; }

// ---------- world constants (metres, three.js axes: x right, y up, -z away from player) ----------
const BR = 0.11, RR = 0.19, RIM_Y = 2.62, HOOP_Z = -3.66, BACK_Z = -3.98, FRONT_Z = -1.2;
const HW = 0.56, Y0 = 0.88, S = 0.22, FUN = 0.06, CEIL = 3.7, G = 9.8, GAME_LEN = 60, NBALLS = 6;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- renderer ----------
const glc = $('gl'), fx = $('fx'), fctx = fx.getContext('2d');

const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 60);

addEventListener('resize', fit); fit();

// ---------- procedural textures ----------
function cnv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function tex(c, srgb = true) { const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = maxAniso; return t; }

function ballTextures() {

}

function woodTexture() {
  const ppm = 457, w = 512, h = Math.round(ppm * 2.82), [c, g] = cnv(w, h);
  const pw = 32;
  for (let x = 0; x < w; x += pw) {
    let y = -Math.random() * 400;
    while (y < h) {
      const len = 300 + Math.random() * 500, l = 50 + Math.random() * 12, hue = 28 + Math.random() * 8;

  g.strokeRect(cx - keyW / 2, -10, keyW, keyB + 10);

  g.beginPath(); g.arc(cx, hy, 1.3 * ppm, 0.05, Math.PI - 0.05); g.stroke();

  g.fillStyle = 'rgba(255,248,236,.18)'; g.fillText('HOOP RUSH', cx, (4.02 - 2.05) * ppm);
  const t = tex(c); return t;
}

function netTexture() {
  const [c, g] = cnv(128, 128);
  g.strokeStyle = 'rgba(240,240,248,1)'; g.lineWidth = 3;

function backArtTexture() {

function boardTexture() {
  const [c, g] = cnv(512, 342);

function carpetTexture() {
  const [c, g] = cnv(512, 512);
  g.fillStyle = '#120c22'; g.fillRect(0, 0, 512, 512);
  const cols = ['#e2367a', '#26c6da', '#ffcc33', '#7c4dff'];
  for (let i = 0; i < 90; i++) {

    else { g.moveTo(x, y); g.bezierCurveTo(x + s, y - s, x + s, y + s, x + 2 * s, y); }

function neonSign(text, color, w = 1024, h = 256) {
  const [c, g] = cnv(w, h);
  g.font = `${h * .55}px Bungee, Impact, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = color; g.shadowBlur = 40; g.strokeStyle = color; g.lineWidth = 8;
  g.strokeText(text, w / 2, h / 2); g.shadowBlur = 12; g.strokeStyle = '#fff'; g.lineWidth = 2.5; g.strokeText(text, w / 2, h / 2);

}

// seven-segment LED digits
const SEG = { '0': 'abcdef', '1': 'bc', '2': 'abged', '3': 'abgcd', '4': 'fgbc', '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abcdfg', '-': 'g', ' ': '' };

}
function drawDigits(g, str, x, y, w, h, gap, on) {
  [...str].forEach((ch, i) => {
    g.save(); g.translate(x + i * (w + gap), y); g.transform(1, 0, -0.08, 1, 0, 0); g.scale(w, h / 2);
    for (const s of 'abcdefg') {
      segPath(g, s, 0.17);

    }

  });
}
function drawScoreboard(g, sc, tm, best, fire, flash) {
  const w = 1024, h = 372;
  g.fillStyle = '#060608'; g.fillRect(0, 0, w, h);
  const box = (x, bw, label, color) => {
    g.fillStyle = '#0d0d12'; g.fillRect(x, 26, bw, 320);
    g.strokeStyle = 'rgba(255,255,255,.08)'; g.lineWidth = 3; g.strokeRect(x, 26, bw, 320);
    g.fillStyle = '#e9e2d6'; g.font = '700 38px "Barlow Condensed", Arial Narrow, sans-serif'; g.textAlign = 'center';
    g.fillText(label, x + bw / 2, 76);

  drawDigits(g, String(sc).padStart(3, ' '), 70, 104, 92, 196, 22, '#ff3b22');
  drawDigits(g, String(tm).padStart(2, '0'), 492, 104, 76, 160, 20, flash ? '#ff3b22' : '#ffb22e');
  drawDigits(g, String(best).padStart(3, ' '), 768, 112, 52, 118, 16, '#ff6a3a');

  g.beginPath(); g.roundRect ? g.roundRect(530, 286, 96, 44, 8) : g.rect(530, 286, 96, 44); g.fill(); g.shadowBlur = 0;
  g.fillStyle = fire ? '#1a0a00' : 'rgba(255,178,46,.25)'; g.font = '700 34px "Barlow Condensed", Arial Narrow, sans-serif';
  g.fillText('2X', 578, 320);
}
function drawMarquee(g, t) {
  const w = 1024, h = 252;
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#2a0b07'); gr.addColorStop(1, '#0c0405');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.font = '128px Bungee, Impact, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const tg = g.createLinearGradient(0, 60, 0, 190); tg.addColorStop(0, '#ffe08a'); tg.addColorStop(.5, '#ffa21c'); tg.addColorStop(1, '#ff5a12');
  g.shadowColor = '#ff7a1f'; g.shadowBlur = 34; g.fillStyle = tg; g.fillText('HOOP RUSH', w / 2, h / 2 + 6);

    const x = 18 + i * (w - 36) / (n - 1), on = (i + ph) % 3 === 0;
    g.fillStyle = on ? '#fff4c2' : '#5a3a14'; g.shadowColor = '#ffd36a'; g.shadowBlur = on ? 16 : 0;

// ---------- environment map ----------
{
  const pm = new THREE.PMREMGenerator(renderer), es = new THREE.Scene();
  es.add(new THREE.Mesh(new THREE.BoxGeometry(20, 10, 20), new THREE.MeshBasicMaterial({ color: 0x141020, side: THREE.BackSide })));
  const panel = (c, x, y, z, w, h, d) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ color: c })); m.position.set(x, y, z); es.add(m); };
  panel(0xffffff, 0, 4.5, -2, 6, .1, 1.2); panel(0xfff0dd, 0, 4.5, 3, 6, .1, 1.2);
  panel(0xff3c8c, -9.5, 1, 0, .1, 2, 6); panel(0x2ad6ff, 9.5, 1, 0, .1, 2, 6); panel(0xff9a2a, 0, 2, -9.5, 8, 1.5, .1);
  scene.environment = pm.fromScene(es, 0.04).texture;
}

// ---------- materials ----------
const BT = ballTextures();
const M = {
  chrome: new THREE.MeshStandardMaterial({ color: 0xdfe3ea, metalness: 1, roughness: 0.2 }),
  paint: new THREE.MeshStandardMaterial({ color: 0x1c2f86, metalness: 0.4, roughness: 0.32 }),

  },
  // cabinet speaker score chime

  // coin dropping through the coin mech

for (const k of Object.keys(sfx)) { const f = sfx[k]; sfx[k] = (...a) => { if (A) { trimDb = TRIM[k] || 0; f(...a); } }; }

// ---------- game state ----------
let state = 'menu', score = 0, best = 0, timeLeft = GAME_LEN, streak = 0, made = 0, shots = 0, endTimer = 0;
let hoopX = 0, hoopT = 0, netKick = 0, tAll = 0, hold = null, pops = [], firstShot = true;
try { best = +localStorage.getItem('hoopRushBest') || 0; } catch (e) {}
const onFire = () => streak >= 3;

let sbKey = '';
function refreshScoreboard(force) {
  const tm = Math.ceil(timeLeft), flash = state === 'play' && timeLeft <= 10 && (tAll * 2 % 1) < .5;
  const k = [score, tm, best, onFire(), flash].join();
  if (k === sbKey && !force) return; sbKey = k;
  drawScoreboard(sbCanvas[1], score, tm, best, onFire(), flash); sbTex.needsUpdate = true;
}
let mqT = -1;
function refreshMarquee(force) { const f = Math.floor(tAll * 9); if (f === mqT && !force) return; mqT = f; drawMarquee(mqCanvas[1], tAll); mqTex.needsUpdate = true; }
refreshScoreboard(true); refreshMarquee(true);
if (document.fonts) {
  Promise.all([document.fonts.load('128px Bungee'), document.fonts.load('700 38px "Barlow Condensed"')]).then(() => {
    refreshScoreboard(true); refreshMarquee(true); M.ramp.map.image = woodTexture().image; M.ramp.map.needsUpdate = true;
    drawScoreboard(attractSB[1], 0, 60, 0, false, false); attractTex.needsUpdate = true;
  }).catch(() => {});
}

// ---------- physics ----------
function stepBall(b, h) {
  const py = b.y;

  if (dist < BR) {

    const vn = b.vx * n[0] + b.vy * n[1] + b.vz * n[2];

}
function collideBalls() {
  for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) {
    const a = balls[i], b = balls[j];

function physics(dt) {

  for (let s = 0; s < n; s++) { for (const b of balls) if (!b.held) stepBall(b, h); collideBalls(); }
}

function scoreBall(b) {
  const swish = !b.touched;
  let pts = swish ? 3 : 2;
  if (onFire()) pts *= 2;
  streak++; score += pts; made++; netKick = 1;
  const p = proj(hoopX, RIM_Y + .25, HOOP_Z);
  pops.push({ x: p.x, y: p.y, t: 0, text: (swish ? 'SWISH +' : '+') + pts, hot: pts >= 4 || swish });
  sfx.swish(swish, hoopX); setTimeout(() => sfx.score(), 140);
}

// ---------- input ----------
const tv = new THREE.Vector3();
function proj(x, y, z) { tv.set(x, y, z).project(camera); return { x: (tv.x + 1) / 2 * W, y: (1 - tv.y) / 2 * H }; }

function pickBall(px, py) {
  let bestB = null, bd = Math.max(120, Math.min(W, H) * .2);
  for (const b of balls) { if (!pickable(b)) continue; const p = proj(b.x, b.y, b.z), d = Math.hypot(p.x - px, p.y - py); if (d < bd) { bd = d; bestB = b; } }
  return bestB;
}
glc.addEventListener('pointerdown', e => {
  if (state !== 'play' || hold || gateAng > 0) return;
  const b = pickBall(e.clientX, e.clientY); if (!b) return;
  b.held = true; b.vx = b.vy = b.vz = 0; b.live = false; b.inNet = false;
  const p0 = proj(b.x, b.y, b.z), p1 = proj(b.x + .1, b.y, b.z);
  hold = { b, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, bx: b.x, by: b.y + .13, bz: Math.min(b.z + .04, FRONT_Z - BR), ppm: (p1.x - p0.x) / .1 };
  try { glc.setPointerCapture(e.pointerId); } catch (_) {}
  sfx.pick(b.x);
});
glc.addEventListener('pointermove', e => { if (hold) { hold.x = e.clientX; hold.y = e.clientY; } });
function release() {
  if (!hold) return; const { b } = hold, dx = hold.x - hold.x0, dy = hold.y0 - hold.y; hold = null; b.held = false;
  if (state === 'play' && dy > 28) launch(b, dx, dy);
}
glc.addEventListener('pointerup', release);
glc.addEventListener('pointercancel', release);

function aimFor(b, dx, dy) {
  const B = proj(b.x, b.y, b.z), R = proj(hoopX, RIM_Y, HOOP_Z), R2 = proj(hoopX + .5, RIM_Y, HOOP_Z);
  const ppm = (R2.x - R.x) / .5, span = Math.max(40, B.y - R.y), L0 = span * .6, ratio = dy / L0;
  const sxAt = B.x + dx / Math.max(dy, 1) * span;

}
function launch(b, dx, dy) {
  const a = aimFor(b, dx, dy), T = 1.0, ty = RIM_Y + .03, tz = -a.depth;
  b.vx = (a.tx - b.x) / T; b.vz = (tz - b.z) / T; b.vy = (ty - b.y + .5 * G * T * T) / T;

  sfx.throw(b.x); firstShot = false;
}

// ---------- game flow ----------
function start() {
  initAudio();
  if (ac && ac.state === 'suspended') ac.resume();
  score = 0; streak = 0; made = 0; shots = 0; timeLeft = GAME_LEN; hoopT = 0; pops = [];
  for (const b of balls) { b.live = false; b.inNet = false; }
  $('startScreen').hidden = true; $('endScreen').hidden = true;
  state = 'play';
  sfx.coin(); setTimeout(() => { if (state === 'play') { gateTarget = GATE_OPEN; sfx.gate(); } }, ac ? 520 : 0);
  refreshScoreboard(true);
}
function buzzer() {
  state = 'ending'; endTimer = 2.4; timeLeft = 0; sfx.buzzer();
  if (hold) { hold.b.held = false; hold = null; }
  gateTarget = GATE_CLOSED; setTimeout(sfx.gate, 250);
}
function finish() {
  state = 'over';
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('hoopRushBest', best); } catch (e) {} }
  refreshScoreboard(true);
  $('final').textContent = score; $('newBest').hidden = !isBest || score === 0;
  $('endLine').textContent = shots ? `${made} / ${shots}` : '';
  coinGate(); $('endScreen').hidden = false; ($('againBtn').hidden ? document.querySelector('#endScreen [data-get-coins]') : $('againBtn')).focus();
}
// ---------- coins (pineapp.win): 1 coin = 1 game ----------
const Coins = window.Coins;
// A coin inserted at the cabinet in the arcade hall pays for the first game here.
let credit = Coins ? (Coins.takeCredit('hoop-rush') ? 1 : 0) : 1;
function coinGate() {
  const canPay = credit > 0 || !Coins || Coins.balance() > 0;
  $('startBtn').textContent = credit > 0 ? 'Press start' : 'Insert coin';
  $('startBtn').hidden = !canPay; $('againBtn').hidden = !canPay;
  document.querySelectorAll('[data-get-coins]').forEach(a => { a.hidden = canPay; });
}
function payAndStart() {
  if (state === 'play' || state === 'ending') return;
  if (credit > 0) credit--;
  else if (Coins && !Coins.spend()) { coinGate(); return; }
  start();
}
if (Coins) Coins.onChange(() => { if (state !== 'play' && state !== 'ending') coinGate(); });
coinGate();
// Already paid at the cabinet: skip the start card and drop straight into the game.
if (credit > 0) payAndStart();
// Browsers keep sound paused until the player touches the page; wake it on the first touch or key.
const wakeAudio = () => { initAudio(); if (ac && ac.state === 'suspended') ac.resume(); };
addEventListener('pointerdown', wakeAudio, { capture: true });
addEventListener('keydown', wakeAudio, { capture: true });
$('startBtn').onclick = payAndStart; $('againBtn').onclick = payAndStart;

// ---------- effects layer ----------
function drawFx(dt) {
  fctx.clearRect(0, 0, W, H);
  // first game only: a ghost fingertip grabs the front ball and flicks it up, no words
  if (state === 'play' && firstShot && !hold && gateAng < 0) {
    let fb = null; for (const b of balls) if (pickable(b) && (!fb || b.z > fb.z)) fb = b;
    if (fb) {
      const B = proj(fb.x, fb.y, fb.z), R = proj(hoopX, RIM_Y, HOOP_Z), u = (tAll % 1.8) / 1.8;
      const k = u < .25 ? 0 : Math.min(1, (u - .25) / .3), e = 1 - Math.pow(1 - k, 3);
      const fx = B.x + (R.x - B.x) * e * .25, fy = B.y - (B.y - R.y) * e * .45;
      const alpha = u < .15 ? u / .15 : u < .6 ? 1 : Math.max(0, 1 - (u - .6) / .2);
      if (alpha > 0) {
        fctx.globalAlpha = alpha * .9;
        if (k > 0) { const g = fctx.createLinearGradient(B.x, B.y, fx, fy); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,.55)');
          fctx.strokeStyle = g; fctx.lineWidth = 14; fctx.lineCap = 'round'; fctx.beginPath(); fctx.moveTo(B.x, B.y); fctx.lineTo(fx, fy); fctx.stroke(); }

        fctx.strokeStyle = 'rgba(255,255,255,.9)'; fctx.lineWidth = 2.5; fctx.beginPath(); fctx.arc(fx, fy, 22 * press, 0, 7); fctx.stroke();

  pops = pops.filter(p => (p.t += dt) < 1.2);

    fctx.globalAlpha = Math.min(1, (1.2 - p.t) * 2.5);
    fctx.font = `${p.hot ? 30 : 26}px Bungee, Impact, sans-serif`;
    const y = p.y - p.t * 60;
    fctx.fillStyle = '#7a1d06'; fctx.fillText(p.text, p.x + 3, y + 3);
    fctx.fillStyle = p.hot ? '#ffc23d' : '#fff4e6'; fctx.fillText(p.text, p.x, y);

}

// ---------- main loop ----------
const qTmp = new THREE.Quaternion(), axis = new THREE.Vector3();
for (let i = 0; i < 240; i++) physics(1 / 60);
let last = performance.now();
function frame(now) {

  if (state === 'ending') { endTimer -= dt; if ((endTimer <= 0 && !balls.some(b => b.live)) || endTimer < -3) finish(); }
  if (score >= 20) { const fast = score >= 40; hoopT += dt * (fast ? 1.25 : .75); hoopX = Math.sin(hoopT) * (fast ? .24 : .17); }
  else hoopX += (0 - hoopX) * Math.min(1, dt * 3);

  hoopLight.target.position.x = hoopX;

  if (hold) {
    const b = hold.b, dx = hold.x - hold.x0, dy = Math.max(0, hold.y0 - hold.y);
    const tx = clamp(hold.bx + dx / hold.ppm * .25, -HW + BR, HW - BR), ty = hold.by + Math.min(dy, 120) / hold.ppm * .12;
    b.x += (tx - b.x) * Math.min(1, dt * 18); b.y += (ty - b.y) * Math.min(1, dt * 18); b.z += (hold.bz - b.z) * Math.min(1, dt * 18);

  const fire = onFire(), pulse = .5 + .5 * Math.sin(tAll * 10);

  M.stripMain.emissive.setHex(fire ? 0xff2a00 : 0xff6510); M.stripMain.emissiveIntensity = fire ? 2 + pulse * 2 : 2.2;

}
requestAnimationFrame(frame);
})();

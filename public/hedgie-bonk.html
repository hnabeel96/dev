<style>
/* Layout: full-bleed WebGL arcade hall; LED score bezels pinned top, coin-op card docked at the bottom over a dark fade. Single committed dark (night arcade) look. */
:root{
  --hall:#07030e;
  --ink:#f7efe1;
  --ink-dim:#b9a9cf;
  --led:#ff3b2f;
  --amber:#ffb02e;
  --pink:#ff3fa4;
  --cyan:#3ee6ff;
  --bezel:#140a22;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --digits:'VT323',ui-monospace,'Courier New',monospace;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--hall);color:var(--ink);font-family:var(--body)}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-tap-highlight-color:transparent;outline:none}
#scene.playing{cursor:none}

#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;pointer-events:none}
.led{background:linear-gradient(#1b0f2c,#0d0617);border:2px solid #2d1a46;border-radius:10px;padding:4px 12px 2px;min-width:74px;text-align:center;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.06),0 6px 18px rgba(0,0,0,.5)}
.lbl{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}
.val{display:block;font-family:var(--digits);font-size:38px;line-height:1;color:var(--led);text-shadow:0 0 8px rgba(255,59,47,.85),0 0 22px rgba(255,59,47,.45);font-variant-numeric:tabular-nums}
.val.amber{color:var(--amber);text-shadow:0 0 8px rgba(255,176,46,.85),0 0 22px rgba(255,176,46,.4)}
.val.cyan{color:var(--cyan);text-shadow:0 0 8px rgba(62,230,255,.85),0 0 22px rgba(62,230,255,.4)}
.val.pop{animation:pop .22s ease-out}
.val.hurry{animation:hurry .5s steps(2) infinite}
@keyframes pop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes hurry{50%{opacity:.35}}

#mute{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:5;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-dim);background:rgba(20,10,34,.8);border:1.5px solid #3a2457;border-radius:999px;padding:8px 14px;cursor:pointer}
#mute:hover{color:var(--ink)}
#mute:focus-visible,.coin:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}

#overlay{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;
  padding-inline:16px;padding-block:16px calc(env(safe-area-inset-bottom,0px) + 56px);
  background:linear-gradient(to top,rgba(7,3,14,.95) 0%,rgba(7,3,14,.72) 26%,rgba(7,3,14,0) 52%);pointer-events:none}
.card{pointer-events:auto;width:100%;max-width:540px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.card h1{font-family:var(--display);font-weight:400;font-size:clamp(42px,10vw,78px);line-height:.92;margin:0;color:var(--amber);
  text-shadow:3px 3px 0 var(--pink),6px 6px 0 #2a0f45;text-wrap:balance;letter-spacing:.01em}
.card .sub{margin:0;max-width:44ch;color:var(--ink-dim);font-size:15px;line-height:1.5;text-wrap:balance}
.card .sub b{color:var(--ink);font-weight:600}
.rules{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0;padding:0;list-style:none}
.rules li{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:6px;background:#1b0f2c;border:1px solid #33204d;color:var(--ink)}
.rules li span{color:var(--amber)}
.coin{font-family:var(--display);font-size:22px;letter-spacing:.02em;padding:14px 30px;border-radius:999px;border:3px solid #1a0b06;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#ffe08a,var(--amber) 55%,#e58a00);color:#1a0b06;box-shadow:0 6px 0 #8f5200,0 0 34px rgba(255,176,46,.45);
  transition:transform .08s,box-shadow .08s}
.coin:active{transform:translateY(4px);box-shadow:0 2px 0 #8f5200,0 0 20px rgba(255,176,46,.35)}
.coin small{font-family:var(--digits);font-size:24px;margin-left:8px;vertical-align:-1px}
.hint{font-size:12px;color:var(--ink-dim);letter-spacing:.04em;margin:0}
.big{font-family:var(--digits);font-size:84px;line-height:.8;color:var(--led);text-shadow:0 0 12px rgba(255,59,47,.85),0 0 34px rgba(255,59,47,.45);font-variant-numeric:tabular-nums}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.badge{display:inline-block;font-family:var(--display);font-size:13px;color:#1a0b06;background:var(--cyan);padding:4px 10px;border-radius:4px;transform:rotate(-3deg)}
@media (max-width:440px){.val{font-size:30px}.led{min-width:60px;padding:3px 8px 1px}.lbl{font-size:9px}#hud{gap:6px}}
@media (prefers-reduced-motion:reduce){.val.pop,.val.hurry{animation:none}}
/* pineapp.win: back + coins bottom-left (the score bezels own the top), Get coins when empty */
#site{position:fixed;z-index:5;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:10px;align-items:center}
.back{width:36px;height:36px;display:grid;place-items:center;border-radius:999px;background:rgba(20,10,34,.8);border:1.5px solid #3a2457;color:var(--ink);font:600 18px/1 var(--body);text-decoration:none}
.back:hover{border-color:var(--amber)}
.back:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
#getCoins,#insertCoin{position:fixed;cursor:pointer;font-weight:400;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);display:inline-flex;align-items:center;gap:12px;
  font-family:var(--display);font-size:20px;padding:12px 26px;border-radius:999px;border:3px solid #1a0b06;color:#1a0b06;text-decoration:none;
  background:radial-gradient(circle at 35% 30%,#ffe08a,var(--amber) 55%,#e58a00);box-shadow:0 6px 0 #8f5200,0 0 34px rgba(255,176,46,.45)}
#getCoins .coin-icon,#insertCoin .coin-icon{width:22px;height:22px}
#getCoins .coin-icon::after,#insertCoin .coin-icon::after{inset:6px}
#getCoins:focus-visible,#insertCoin:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
</style>

<script>
(() => {
'use strict';
const V3 = THREE.Vector3;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const easeOutBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeInQuad = t => t * t;
const C = h => new THREE.Color(h).convertSRGBToLinear();
const glow = (h, k) => C(h).multiplyScalar(k);

/* ---------- renderer ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const PR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(PR);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const hasPost = !!(THREE.EffectComposer && THREE.UnrealBloomPass && THREE.GammaCorrectionShader && THREE.RenderPass && THREE.ShaderPass);

const scene = new THREE.Scene();
scene.background = C('#07030e');
scene.fog = new THREE.FogExp2(C('#0c0618'), 0.034);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 120);

let composer = null, bloom = null;
if (hasPost) {
  let rt;
  if (renderer.capabilities.isWebGL2 && THREE.WebGLMultisampleRenderTarget) {
    rt = new THREE.WebGLMultisampleRenderTarget(4, 4, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });
  }

  composer.addPass(new THREE.RenderPass(scene, camera));
  bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), 0.9, 0.55, 0.82);
  composer.addPass(bloom);
  composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
}

/* ---------- canvas texture helper ---------- */
let T = 0;
function canvasTex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(opts.repeat[0], opts.repeat[1]); }

}
function redraw(t) { const u = t.userData; u.draw(u.g, u.c.width, u.c.height); t.needsUpdate = true; }
function star2d(g, x, y, n, r1, r2) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? r2 : r1, a = i / (n * 2) * Math.PI * 2 - Math.PI / 2;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath();
}
const DISPLAY = "Bungee, 'Arial Black', Impact, sans-serif";
const DIGITS = "VT323, 'Courier New', monospace";

/* ---------- arcade carpet (blacklight) ---------- */
const carpetTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#0c0926'; g.fillRect(0, 0, w, h);
  const cols = ['#21f0ff', '#ff2fb0', '#ffe14a', '#7cff4f', '#a259ff'];
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const shapes = [];
  for (let i = 0; i < 70; i++) shapes.push({ x: rnd() * w, y: rnd() * h, c: cols[i % 5], s: 10 + rnd() * 22, k: i % 5, r: rnd() * 6.28 });
  for (const dx of [-w, 0, w]) for (const dy of [-h, 0, h]) for (const s of shapes) {
    g.save(); g.translate(s.x + dx, s.y + dy); g.rotate(s.r);
    g.strokeStyle = s.c; g.fillStyle = s.c; g.lineWidth = 3.5; g.lineCap = 'round';
    if (s.k === 0) { g.beginPath(); g.moveTo(-s.s, 0); for (let j = 1; j <= 4; j++) g.quadraticCurveTo(-s.s + (j - .5) * s.s / 2, (j % 2 ? -1 : 1) * s.s * .5, -s.s + j * s.s / 2, 0); g.stroke(); }

    else if (s.k === 2) { g.beginPath(); g.moveTo(0, -s.s * .6); g.lineTo(s.s * .55, s.s * .45); g.lineTo(-s.s * .55, s.s * .45); g.closePath(); g.stroke(); }
    else if (s.k === 3) { star2d(g, 0, 0, 5, s.s * .5, s.s * .22); g.fill(); }
    else { g.beginPath(); g.moveTo(-s.s * .6, -s.s * .2); g.lineTo(0, s.s * .3); g.lineTo(s.s * .6, -s.s * .2); g.stroke(); }
    g.restore();
  }
}, { repeat: [9, 9] });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ map: carpetTex, emissiveMap: carpetTex, emissive: new THREE.Color(0.55, 0.55, 0.6), roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

/* ---------- room ---------- */
const wallMat = new THREE.MeshStandardMaterial({ color: C('#1a0f2b'), roughness: .95 });
function wall(w, h, x, y, z, ry) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat); m.position.set(x, y, z); m.rotation.y = ry; scene.add(m); return m; }
wall(40, 10, 0, 5, -15, 0);
wall(40, 10, -13, 5, -2, Math.PI / 2);
wall(40, 10, 13, 5, -2, -Math.PI / 2);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: C('#0b0612'), roughness: 1 }));
ceil.rotation.x = Math.PI / 2; ceil.position.y = 9.5; scene.add(ceil);

function neonTex(text, color, w = 1024, h = 256, size = 150) {
  return canvasTex(w, h, (g) => {
    g.clearRect(0, 0, w, h);
    g.font = `${size}px ${DISPLAY}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
    g.shadowColor = color; g.shadowBlur = 34; g.strokeStyle = color; g.lineWidth = 16; g.strokeText(text, w / 2, h / 2 + 8);
    g.shadowBlur = 0; g.lineWidth = 5; g.strokeStyle = '#fff6fb'; g.strokeText(text, w / 2, h / 2 + 8);
  });
}
const neonSigns = [];
function neonSign(text, color, x, y, z, ry, wdt) {
  const tex = neonTex(text, color);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(wdt, wdt / 4),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, color: glow('#ffffff', 2.2), toneMapped: false }));
  m.position.set(x, y, z); m.rotation.y = ry; scene.add(m); neonSigns.push({ m, tex, base: 2.2, phase: Math.random() * 10 });
  return m;
}
neonSign('PRIZES', '#ff3fa4', -6.5, 6.3, -14.9, 0, 6);
neonSign('TOKENS', '#3ee6ff', 6.5, 6.3, -14.9, 0, 6);
neonSign('PLAY!', '#ffb02e', -12.9, 6.2, -6, Math.PI / 2, 5);
neonSign('BONUS', '#7cff4f', 12.9, 6.2, -6, -Math.PI / 2, 5);

// zig-zag neon tube on the back wall + ceiling light strips
{
  const pts = []; for (let i = 0; i <= 16; i++) pts.push(new V3(-9 + i * 1.125, 8.0 + (i % 2 ? .45 : -.45), -14.85));
  const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.05), 200, .05, 8, false),
    new THREE.MeshBasicMaterial({ color: glow('#ffe14a', 3), toneMapped: false }));
  scene.add(tube);
  const stripCols = ['#ff3fa4', '#3ee6ff', '#a259ff'];
  [-2, -7, -11].forEach((z, i) => {
    const s = new THREE.Mesh(new THREE.BoxGeometry(14, .06, .14), new THREE.MeshBasicMaterial({ color: glow(stripCols[i], 3), toneMapped: false }));
    s.position.set(0, 9.3, z); scene.add(s);
  });
}

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(C('#6a4bb0'), C('#140a22'), 0.55));
const fill = new THREE.DirectionalLight(C('#b9c6ff'), 0.32); fill.position.set(-2, 6, 10); scene.add(fill);
const spot = new THREE.SpotLight(C('#ffe0b0'), 2.3, 22, 0.52, 0.55, 1.2);
spot.position.set(0, 8.2, 1.2); spot.target.position.set(0, 1, -0.2);
spot.castShadow = true; spot.shadow.mapSize.set(1024, 1024); spot.shadow.bias = -0.0006; spot.shadow.camera.near = 2; spot.shadow.camera.far = 14;
scene.add(spot, spot.target);
[['#ff3fa4', -7, 4.5, -11], ['#3ee6ff', 7, 4.5, -11], ['#a259ff', 0, 5.5, -6]].forEach(([c, x, y, z]) => {
  const p = new THREE.PointLight(C(c), 1.6, 16, 1.6); p.position.set(x, y, z); scene.add(p);
});
const impactLight = new THREE.PointLight(C('#fff1c4'), 0, 5, 2); scene.add(impactLight);

// hanging lamp + volumetric beam + dust
{
  const shade = new THREE.Mesh(new THREE.ConeGeometry(.65, .55, 28, 1, true), new THREE.MeshStandardMaterial({ color: C('#2a2233'), roughness: .4, metalness: .6, side: THREE.DoubleSide }));
  shade.position.set(0, 8.45, 1.2); scene.add(shade);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(.16, 16, 12), new THREE.MeshBasicMaterial({ color: glow('#ffe7c2', 4), toneMapped: false }));
  bulb.position.set(0, 8.22, 1.2); scene.add(bulb);
  const cord = new THREE.Mesh(new THREE.CylinderGeometry(.015, .015, 1, 6), new THREE.MeshBasicMaterial({ color: C('#111') }));
  cord.position.set(0, 9.0, 1.2); scene.add(cord);
  const beamTex = canvasTex(4, 128, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#fff'); gr.addColorStop(1, '#000'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  beamTex.encoding = THREE.LinearEncoding;
  const beam = new THREE.Mesh(new THREE.ConeGeometry(3.6, 7.2, 40, 1, true), new THREE.MeshBasicMaterial({
    color: C('#ffd59a'), alphaMap: beamTex, transparent: true, opacity: .11, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false, fog: false }));
  beam.position.set(0, 8.2 - 3.6, 0.8); beam.rotation.x = -0.05; scene.add(beam);
}
const motes = (() => {
  const n = 260, pos = new Float32Array(n * 3), seed = [];
  for (let i = 0; i < n; i++) { const r = Math.sqrt(Math.random()) * 2.6, a = Math.random() * 6.28; pos[i * 3] = Math.cos(a) * r; pos[i * 3 + 1] = rand(1.3, 7.5); pos[i * 3 + 2] = Math.sin(a) * r + .6; seed.push(Math.random() * 10); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const dot = canvasTex(32, 32, (g) => { const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 32, 32); });
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ map: dot, size: .05, color: C('#ffe2b0'), transparent: true, opacity: .7, depthWrite: false, blending: THREE.AdditiveBlending }));
  scene.add(pts); return { pts, pos, seed, n };
})();

/* ---------- background cabinets ---------- */
function screenTex(kind) {
  return canvasTex(128, 96, (g, w, h) => {
    g.fillStyle = '#050208'; g.fillRect(0, 0, w, h);
    if (kind === 0) { // shooter

const keyHole = { '7': 0, '8': 1, '9': 2, '4': 3, '5': 4, '6': 5, '1': 6, '2': 7, '3': 8, q: 0, w: 1, e: 2, a: 3, s: 4, d: 5, z: 6, x: 7, c: 8 };
window.addEventListener('keydown', e => {
  if (document.activeElement !== muteBtn) initAudio();
  if (state !== 'playing') return; // a new round only starts from the Insert coin button
  if (state !== 'playing') return;
  const k = e.key.toLowerCase(); if (!(k in keyHole)) return;
  const h = hogs[keyHole[k]]; aim.set(h.x, BT, h.z); swing(); e.preventDefault();
});
const muteBtn = $('mute');
muteBtn.addEventListener('click', () => {
  muted = !muted; muteBtn.textContent = muted ? 'Sound off' : 'Sound on'; muteBtn.setAttribute('aria-pressed', String(muted));
  if (master) master.gain.setTargetAtTime(muted ? 0 : .85, ac.currentTime, .02);
});

/* ---------- camera framing ---------- */
const camTarget = new V3(0, 2.2, -.5), focusLook = new V3(0, 1.45, 2.2), focusPos = new V3(), lookAt = new V3(); let camBase = new V3();
function resize() {
  const w = window.innerWidth, h = window.innerHeight, asp = w / h;
  renderer.setSize(w, h, false);
  camera.aspect = asp; camera.fov = asp < .8 ? 62 : 50;
  const dir = asp < .8 ? new V3(0, .78, .62).normalize() : new V3(0, .7, .71).normalize();
  const halfTan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(9.2, 3.35 / (halfTan * asp));
  camBase.copy(camTarget).add(dir.multiplyScalar(dist));
  focusPos.set(asp < .8 ? .7 : 1.2, asp < .8 ? 2.9 : 2.5, asp < .8 ? 10.8 : 8.6);
  camera.updateProjectionMatrix();
  if (composer) { composer.setPixelRatio(PR); composer.setSize(w, h); bloom.resolution.set(w * PR, h * PR); }
}
window.addEventListener('resize', resize); resize();

/* ---------- fonts → redraw text textures ---------- */
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load(`80px Bungee`), document.fonts.load(`80px VT323`)]).then(() => {
    [frontTex, topTex, backTex, marqTex].forEach(redraw);
    neonSigns.forEach(s => redraw(s.tex));
  }).catch(() => {});
}

/* ---------- loop ---------- */
const clock = new THREE.Clock(); let frame = 0;
function spawnLogic(dt) {
  if (state !== 'playing') return;
  const playing = state === 'playing';
  const p = playing ? clamp(elapsed / ROUND, 0, 1) : .2;
  const interval = playing ? lerp(.95, .42, p) : 1.15;
  const upTime = playing ? lerp(1.25, .62, p) : 1.5;
  const maxActive = playing ? 1 + Math.floor(p * 2.7) : 2;
  spawnT -= dt;
  if (spawnT <= 0) {
    const activeN = hogs.filter(h => h.state !== 'down').length;
    const free = hogs.filter(h => h.state === 'down');
    if (activeN < maxActive && free.length) {
      const h = free[Math.floor(Math.random() * free.length)];
      const gold = Math.random() < (playing ? .11 : .2);
      const r = Math.random(), pPeek = playing ? .1 + .12 * p : .2, pDodge = playing ? .1 + .15 * p : .3;
      const kind = gold ? 'normal' : r < pPeek ? 'peek' : r < pPeek + pDodge ? 'dodger' : 'normal';
      h.pop(gold, gold ? upTime * .7 : upTime * rand(.85, 1.15), kind);
    }
    spawnT = interval * rand(.6, 1.3);
  }
}

function tickerText() {
  if (state === 'playing') return `BONK!  BONK!  BONK!     SCORE ${pad4(score)}     ×${mult()} COMBO     HI ${pad4(best)}`;
  const again = canPay() ? 'INSERT COIN TO PLAY AGAIN' : 'OUT OF COINS  ★  GET MORE AT THE COIN MACHINE';
  if (state === 'over') return newBest ? `NEW HI-SCORE ${pad4(score)}  ★  NEW HI-SCORE ${pad4(score)}  ★  ${again}` : `GAME OVER  ★  SCORE ${pad4(score)}  ★  HI-SCORE ${pad4(best)}  ★  ${again}`;
  return canPay() ? `INSERT COIN  ★  HI-SCORE ${pad4(best)}  ★  INSERT COIN` : `INSERT COIN  ★  HI-SCORE ${pad4(best)}  ★  ${again}`;
}
function loop() {
  requestAnimationFrame(loop);
  const rdt = Math.min(clock.getDelta(), .05);
  T += rdt; frame++;
  let dt = rdt;
  if (hitstop > 0) { hitstop -= rdt; dt = 0; }

  // game clock
  if (state === 'playing') {
    timeLeft -= rdt; elapsed += rdt;
    const sec = Math.ceil(Math.max(0, timeLeft));
    if (sec !== lastSec) { lastSec = sec; if (sec <= 5 && sec > 0) { sfx.tick(); $('hTime').classList.add('hurry'); } }
    setHud('hScore', pad4(score)); setHud('hTime', String(sec).padStart(2, '0')); setHud('hCombo', '×' + mult());
    if (timeLeft <= 0) endGame();
  }
  if (state === 'over') {
    overT += rdt;
  }
  spawnLogic(dt);

  // hammer
  if (hState === 'down') {
    downT += rdt / .075;
    const s = solveHand(lockAim.x, lockAim.z, hitHeightAt(lockAim.x, lockAim.z));
    hand.lerp(s.hand, 1 - Math.exp(-70 * rdt));
    theta = lerp(downFrom, s.th, easeInQuad(Math.min(1, downT)));
    if (downT >= 1) { theta = s.th; impact(); }
  } else {
    const s = solveHand(aim.x, aim.z, hitHeightAt(aim.x, aim.z));
    hand.lerp(s.hand, 1 - Math.exp(-22 * rdt));
    const rest = s.th + .85 + Math.sin(T * 2.2) * .03;
    const k = 170, c = 15;
    if (dt > 0) { thetaV += ((rest - theta) * k - thetaV * c) * dt; theta += thetaV * dt; }
    if (hState === 'recoil' && Math.abs(rest - theta) < .05) hState = 'idle';
  }
  hammer.position.copy(hand); hammer.rotation.set(theta, PSI, Math.sin(T * 1.7) * .03);
  headSqV += ((1 - headSq) * 520 - headSqV * 18) * rdt; headSq += headSqV * rdt;
  const hs = clamp(headSq, .45, 1.4); head.scale.set(1 / Math.sqrt(hs), hs, 1 / Math.sqrt(hs));

  // hogs
  hogs.forEach(h => h.update(dt, hand.x));

  // cabinet rattle
  cabDipV += ((0 - cabDip) * 420 - cabDipV * 14) * rdt; cabDip += cabDipV * rdt; cab.position.y = cabDip;

  // effects
  const fdt = dt;
  for (const c of confetti) {
    if (c.life <= 0) continue; c.life -= rdt;
    if (!c.rest && fdt > 0) {
      c.v.y -= 9.8 * fdt; c.v.multiplyScalar(Math.pow(.25, fdt)); if (c.v.y < -1.6) c.v.y = -1.6;
      c.m.position.addScaledVector(c.v, fdt); c.m.rotation.x += c.w.x * fdt; c.m.rotation.y += c.w.y * fdt; c.m.rotation.z += c.w.z * fdt;
      const p = c.m.position, onBoard = Math.abs(p.x) < CAB_W / 2 && Math.abs(p.z) < CAB_D / 2, fy = onBoard ? BT + .012 : .012;
      if (p.y < fy) { p.y = fy; c.rest = true; c.m.rotation.set(-Math.PI / 2, 0, c.m.rotation.z); }
    }
    if (c.life <= 0) c.m.visible = false;
  }
  for (const s of sparkStars) { if (s.life <= 0) continue; s.life -= rdt; s.m.position.addScaledVector(s.v, rdt); s.v.multiplyScalar(Math.pow(.05, rdt)); s.m.scale.setScalar(Math.max(.01, s.life / .55 * 1.4)); s.m.lookAt(camera.position); s.m.rotation.z += rdt * 8; if (s.life <= 0) s.m.visible = false; }
  for (const d of puffs) { if (d.life <= 0) continue; d.life -= rdt; d.m.position.addScaledVector(d.v, rdt); d.v.multiplyScalar(Math.pow(.02, rdt)); const k = 1 - d.life / .45; d.m.scale.setScalar(.6 + k * 1.6); d.m.material.opacity = .5 * (1 - k); if (d.life <= 0) d.m.visible = false; }
  for (const w of waves) { if (w.life <= 0) continue; w.life -= rdt; const k = 1 - w.life / .35; w.m.scale.setScalar(1 + k * 1.6); w.m.material.opacity = .8 * (1 - k); if (w.life <= 0) w.m.visible = false; }
  for (const P of popups) { if (P.life <= 0) continue; P.life -= rdt; P.sp.position.y += rdt * 1.2; P.sp.material.opacity = Math.min(1, P.life / .3); const s = 1 + Math.max(0, P.life - .75) * 3; P.sp.scale.set(1.3 * s, .65 * s, 1); if (P.life <= 0) P.sp.visible = false; }
  impactLight.intensity *= Math.pow(.002, rdt);

  // atmosphere: bulbs, neon flicker, coin lamp, screens, motes, ticker
  bulbFlash -= rdt;
  const step = Math.floor(T * (state === 'playing' ? 12 : 7));
  bulbs.forEach((b, i) => { const on = bulbFlash > 0 || (state === 'playing' ? (i + step) % 3 === 0 : (i + step) % 6 < 2); const m = on ? bulbOn : bulbOff; if (b.material !== m) b.material = m; });
  neonSigns.forEach(s => { const f = Math.sin(T * 31 + s.phase) > .985 && Math.random() > .3 ? .35 : 1; s.m.material.color.copy(glow('#ffffff', s.base * f)); });
  if (frame % 3 === 0) screens.forEach(redraw);
  if (frame % 2 === 0) { tickerMsg = tickerText(); redraw(tickerTex); }
  { const pos = motes.pos; for (let i = 0; i < motes.n; i++) { pos[i * 3 + 1] += Math.sin(T * .3 + motes.seed[i]) * .0015; pos[i * 3] += Math.cos(T * .2 + motes.seed[i] * 2) * .001; } motes.pts.geometry.attributes.position.needsUpdate = true; }

  // camera + shake
  trauma = Math.max(0, trauma - rdt * 1.8);
  const sh = reduceMotion ? 0 : trauma * trauma;
  camFocus = lerp(camFocus, focusTarget, 1 - Math.exp(-3.2 * rdt));
  const fe = camFocus * camFocus * (3 - 2 * camFocus);
  camera.position.copy(camBase).lerp(focusPos, fe);
  lookAt.copy(camTarget).lerp(focusLook, fe);
  camera.position.x += Math.sin(T * 7.1) * .08 + sh * .3 * Math.sin(T * 91.3);
  camera.position.y += Math.sin(T * 5.3) * .05 + sh * .25 * Math.sin(T * 77.9 + 1);
  camera.lookAt(lookAt);
  camera.rotation.z += sh * .03 * Math.sin(T * 63.1);

  if (composer) composer.render(); else renderer.render(scene, camera);
}
if (credit > 0) payAndStart(); else { state = 'attract'; coinGate(); }
loop();
})();
</script>

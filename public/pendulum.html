<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <script>

    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'G-WJCZS9H72H');

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#120a24">
  <meta name="description" content="Chrono Pendulum — a precision timing arcade game with metallic pendulum physics and instant reflex hits on pineapp.win.">
  <title>Chrono Pendulum | pineapp.win</title>
  <link rel="stylesheet" href="pendulum.css?v=6">
</head>
<body>
  <div class="game-wrapper">
    <header class="game-header">
      <a class="nav-back icon-only" href="index.html" aria-label="Back to games" title="Back to games">←</a>
      <div class="scoreline" aria-live="polite">
        <strong class="arcade-score" id="current-score" aria-label="Score">000000</strong>
        <span class="arcade-best" aria-label="Best score"><span aria-hidden="true">★</span> <span id="best-score">000000</span></span>
      </div>
      <div class="shields-row" id="shields-display" role="img" aria-label="3 lives left">
        <span class="shield-pip active"></span>
        <span class="shield-pip active"></span>
        <span class="shield-pip active"></span>
      </div>
      <div class="header-controls">
        <button type="button" id="sound-toggle" class="control-btn" aria-label="Toggle sound" title="Toggle sound">
          <span id="sound-icon">🔊</span>
        </button>
      </div>
    </header>

    <main class="game-main">
      <h1 class="visually-hidden">Chrono Pendulum</h1>
      <section class="canvas-container" id="arena-container" aria-label="Tap or press space when the ball is inside the circle">
        <canvas id="game-canvas"></canvas>

        <!-- Wordless game over: tap anywhere or the button to swing again -->
        <div class="game-overlay hidden" id="gameover-overlay">
          <button type="button" id="restart-btn" class="restart-btn" aria-label="Play again" title="Play again">↺</button>
        </div>
      </section>
    </main>
  </div>

  <script src="pendulum.js?v=5"></script>
</body>
